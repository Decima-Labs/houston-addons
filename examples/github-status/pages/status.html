<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Status</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, system-ui, sans-serif; margin: 12px; color: #222; background: transparent; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; } }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  button, select, input, textarea { font: inherit; }
  code, pre { font: 12px ui-monospace, monospace; }
  pre { white-space: pre-wrap; word-break: break-word; }
  ul { padding-left: 18px; margin: 4px 0; }
  .muted { opacity: 0.65; }
  .error { color: #d33; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
</style>
</head>
<body>
<h1>GitHub status</h1>
<p id="now">Checking…</p>
<p class="muted">Last time: <span id="last">never</span></p>
<button id="check">Check again</button>
<p id="status" class="muted"></p>
<script>
  // Every houston.call returns a promise. It rejects with Houston's own words when the gate
  // refuses, the person says no, or the call fails; show them rather than swallowing them.
  const $ = (id) => document.getElementById(id);
  function say(text, isError) {
    const el = $("status");
    el.textContent = text;
    el.className = isError ? "error" : "muted";
  }
  async function call(name, args) {
    try {
      return await houston.call(name, args);
    } catch (e) {
      say(String((e && e.message) || e), true);
      throw e;
    }
  }

const URL_ = "https://www.githubstatus.com/api/v2/status.json";

  async function check() {
    // fetch goes through Houston, only to hosts in permissions.network. It answers
    // { status, body }, with the body as text; no cookies, no custom headers.
    const answer = await call("fetch", { url: URL_ });
    if (answer.status !== 200) return say(`githubstatus.com answered ${answer.status}.`, true);
    const status = JSON.parse(answer.body).status;
    $("now").textContent = status.description;

    const before = await call("storage.get", { key: "last" });
    $("last").textContent = before || "never";
    if (status.indicator !== "none" && before !== status.description) {
      await call("notify", { title: "GitHub", body: status.description });
    }
    await call("storage.set", { key: "last", value: status.description });
    say(`Checked at ${new Date().toLocaleTimeString()}.`);
  }

  $("check").onclick = check;
  check();
</script>
</body>
</html>
